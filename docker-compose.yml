services:
  postgres:
    image: postgres:16-alpine
    container_name: holdem-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-holdem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holdem_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-holdem}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holdem}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
